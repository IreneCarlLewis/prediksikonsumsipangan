[theme]
base = "light"
primaryColor = "#77542E"
backgroundColor = "#F7F3EA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2E2318"
borderColor = "#E6D6BC"
showWidgetBorder = true
baseRadius = "0.6rem"
headingFontWeights = [700, 600]
headingFontSizes = ["2.4rem", "1.6rem", "1.25rem"]
dataframeHeaderBackgroundColor = "#F3E6D0"
dataframeBorderColor = "#B59670"
dataframeHeaderTextColor = "#2E2318"

[theme.sidebar]
backgroundColor = "#F1E4CC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2E2318"
borderColor = "#E0BD8A"



[client]
showErrorDetails = "none"